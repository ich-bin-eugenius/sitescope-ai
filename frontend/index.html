<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SiteScope AI - Website Audits</title>
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="page">
        <div class="overlay"></div>
        <main class="container">
            <!-- Navigation -->
            <nav class="nav">
                <a href="#" class="nav-link">Personal Site - SOON!</a>
                <a href="thanks.html" class="nav-link">Thanks!</a>
                <a href="about.html" class="nav-link">About Project</a>
            </nav>

            <!-- Header -->
            <div class="badge">
                <img src="svg/scan.svg" alt="world" height="16" width="16" />
                <span>Hack Club & Stardance</span>
            </div>

            <h1 class="title text-glow">
                <span class="text-primary">Site</span><span>Scope</span>
                <span class="text-primary">AI</span>
            </h1>
            <p class="subtitle">
                Enter any URL. Get a real audit of SEO, performance,
                and accessibility, along with explanations of what needs fixing.
            </p>

            <!-- Input -->
            <form id="audit-form" class="form">
                <div class="input-wrap">
                    <img src="svg/world.svg" alt="world" height="20" width="20" />
                    <input id="url-input" type="text" placeholder="Enter a URL" autocomplete="off" />
                </div>
                <button id="submit-btn" type="submit" class="btn-primary">Start Audit</button>
            </form>

            <p id="error" class="error hidden"></p>

            <!-- Scanning state -->
            <div id="scanning" class="scanning hidden">
                <div class="scan-bar"><div class="scan-bar-inner"></div></div>
                <div id="scan-lines" class="scan-lines"></div>
            </div>

            <!-- Results -->
            <div id="results" class="results hidden">
                <div class="report-card">
                    <div class="report-info">
                        <p class="label">Report for</p>
                        <p id="report-url" class="report-url"></p>
                        <p id="report-title" class="report-title"></p>
                        <div id="report-meta" class="report-meta"></div>
                    </div>
                    <div class="score-ring">
                        <svg width="180" height="180" class="ring-svg">
                          <circle cx="90" cy="90" r="78" fill="none" stroke-width="10" class="ring-bg" />
                          <circle id="ring-fg" cx="90" cy="90" r="78" fill="none" stroke-width="10" stroke-linecap="round" class="ring-fg" />
                        </svg>
                        <div class="score-center">
                            <span id="overall-score" class="score-number"></span>
                            <span class="score-label">overall</span>
                        </div>
                    </div>
                </div>

                <div id="category-bars" class="category-bars"></div>
                <div id="category-sections"></div>

                <button id="reset-btn" class="btn-outline">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                    Audit another site
                </button>
            </div>

            <!-- Footer -->
            <footer class="footer">
                <p>Build with <3 by Eugene at Hack Club StarDance</p>
                <div class="footer-links">
                    <a href="https://github.com/ich-bin-eugenius" target="_blank">GitHub</a>
                    <a href="https://hackclub.com" target="_blank">Hack Club</a>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
