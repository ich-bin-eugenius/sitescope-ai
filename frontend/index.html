<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="SiteScope AI analyzes your website's performance, SEO, and accessibility using Google Lighthouse and provides AI-generated explanations on how to improve the results.">
    <meta name="viewport" content="width=device-device, initial_scale=1.0">
    <title>Site Scope AI</title>
    <!-- Import font Space Grotesk from Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <!-- Connecting index.html with style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Author</a>
        <a href="#">Links</a>
     </nav>
    -->

    <main class="hero-container">
        <!-- Headline -->
        <h1 class="brand-title">SiteScope AI</h1>

        <!-- Form for entering a URL and launching an audit -->
        <form id="audit-form" class="audit-form">
            <input type="url" id="url-input" placeholder="Enter your url" required class="url-input">
            <button type="submit" class="submit-button">
                Start Audit
            </button>
        </form>

        <!-- Container for results that JS is waiting for -->
        <div id="results-container" style="margin-top: 30px; width: 100%; max-width: 600px; text-align: left;"></div>
    </main>

    <!-- Connecting index.html with script.js -->
    <script src="script.js"></script>
</body>
</html>
