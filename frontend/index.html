<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-device, initial_scale=1.0">
    <title>SiteScope AI</title>
    <!-- Import font Space Grotesk from Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <!-- Connecting index.html with style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Author</a>
        <a href="#">Links</a>
     </nav>
    -->

    <main class="hero-container">
        <!-- Headline -->
        <h1 class="brand-title">SiteScope AI</h1>

        <!-- Form for entering a URL and launching an audit -->
        <form class="audit-form">
            <input type="url" placeholder="Enter your url" required class="url-input">
